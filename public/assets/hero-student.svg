<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDDEC0"/>
      <stop offset="100%" stop-color="#F3B790"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#583101"/>
      <stop offset="100%" stop-color="#3A1C00"/>
    </linearGradient>
    <linearGradient id="sweaterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B4B8"/>
      <stop offset="100%" stop-color="#D6979D"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="200" cy="220" r="140" fill="#FFFFFF" opacity="0.4"/>

  <!-- Character Torso & Sweater -->
  <path d="M 90 500 C 100 370 140 330 200 330 C 260 330 300 370 310 500 Z" fill="url(#sweaterGrad)"/>
  <path d="M 175 330 C 185 355 215 355 225 330 Z" fill="#D6979D"/>

  <!-- Neck -->
  <path d="M 182 280 L 182 335 C 190 340 210 340 218 335 L 218 280 Z" fill="url(#skinGrad)"/>

  <!-- Head -->
  <ellipse cx="200" cy="225" rx="55" ry="68" fill="url(#skinGrad)"/>

  <!-- Hair Back -->
  <path d="M 135 220 C 130 140 270 140 265 220 C 275 280 260 360 250 380 C 240 340 250 250 240 220 C 210 160 160 180 150 240 C 140 280 145 350 140 380 C 130 340 130 260 135 220 Z" fill="url(#hairGrad)"/>

  <!-- Face details -->
  <!-- Smile -->
  <path d="M 188 250 Q 200 262 212 250" stroke="#B45309" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <circle cx="183" cy="220" r="4" fill="#3A1C00"/>
  <circle cx="217" cy="220" r="4" fill="#3A1C00"/>
  <!-- Eyebrows -->
  <path d="M 176 210 Q 183 205 190 209" stroke="#583101" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 210 209 Q 217 205 224 210" stroke="#583101" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Hand holding Phone -->
  <!-- Phone Device in Hand -->
  <g transform="translate(170, 260) rotate(-10)">
    <rect x="0" y="0" width="55" height="100" rx="10" fill="url(#phoneGrad)" stroke="#312E81" stroke-width="2"/>
    <rect x="4" y="8" width="47" height="84" rx="6" fill="#EEF2FF"/>
    <rect x="18" y="3" width="18" height="3" rx="1.5" fill="#312E81"/>
    
    <!-- Mini screen content: QR Checkmark -->
    <circle cx="27" cy="45" r="14" fill="#10B981"/>
    <path d="M 22 45 L 26 49 L 33 41" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="12" y="66" width="30" height="4" rx="2" fill="#4338CA"/>
  </g>

  <!-- Hand Fingers -->
  <path d="M 160 320 C 155 300 170 280 185 295 C 190 310 180 340 160 340 Z" fill="url(#skinGrad)"/>
</svg>
