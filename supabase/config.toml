# Supabase CLI Configuration for Presently
project_id = "presently-qr-attendance"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
port = 54324
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[functions.generate-qr-token]
verify_jwt = true

[functions.verify-attendance]
verify_jwt = true

[functions.export-report]
verify_jwt = true
